# Activate with SPRING_PROFILES_ACTIVE=supabase.
# Copy the exact JDBC host/user from Supabase > Connect > Session pooler (5432).
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.jpa.properties.hibernate.default_schema=commerce
spring.jpa.hibernate.ddl-auto=validate
spring.config.import=optional:file:./application-local.properties
