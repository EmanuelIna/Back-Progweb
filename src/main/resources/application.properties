spring.application.name=API-commerce-pw
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/commerce}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
app.jwt.secret=${JWT_SECRET}
app.cart.secret=${CART_SECRET}
app.cookie.secure=${COOKIE_SECURE:false}
app.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.with-credentials=true
springdoc.swagger-ui.persist-authorization=false
